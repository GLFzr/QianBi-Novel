name: Tests

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    # 仓库面向 Windows（凭据管理器/路径约定），单测也在 Windows 环境验证
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt pytest
      - name: 离线单测（无需 API Key）
        run: python -m pytest tests/unit -q --tb=short
      # H-15：根目录 tests/test_*.py 一并收敛进 CI（曾在 CI 外裸奔）。
      # 逐支显式点名 + tests/unit/test_workflow_probe_list.py 双向核对：
      # 磁盘上每支根测试必须在名单 ∪ 显式豁免里（豁免=test_5ch_e2e，需真 Key，
      # 自带 QIANBI_E2E_REAL=1 环境门）；名单里摘掉任何一支即红。
      - name: 离线根目录测试（H-15 收敛面）
        run: python -m pytest tests/test_5ch_mock.py tests/test_audit_in_session.py tests/test_bench_queue.py tests/test_chapter_session.py tests/test_cisc_merge.py tests/test_offpeak_gate.py tests/test_phase_flags.py tests/test_planted_defects.py tests/test_prefix_lint.py tests/test_preset_v2.py tests/test_prompt_chapter_header.py tests/test_quality.py tests/test_review_v2.py tests/test_s4_static_freeze.py tests/test_scene_cards.py tests/test_span_edit.py tests/test_usage_reasoning.py tests/test_volume_session.py -q --tb=short

  probes:
    # N-30/N-20：探针舰队纳入 CI——离线可判子集，一份名单双处校验：
    # tests/unit/test_workflow_probe_list.py 保证这里点名的每支 probe_*.py 真实存在。
    # 名单=WP-06 本地实测 34 支离线全绿（rc=0+自打结论行）；需真 Key/真机/--exe 的
    # 一律不进（8b3fb80 教训：名单里有不存在的名字；CI 无 Key，真 Key 探针必红）。
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt pytest
      - name: 离线探针舰队（驱动器逐支真退码，任一失败整体红）
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/run_probe_fleet.py probe_about_ui probe_agent_relay probe_backflow_chain probe_cw_dialogue probe_blurb probe_chapter_lock probe_chapter_lock_cross_mode probe_co_outline_parse probe_conn_delete probe_console probe_contract_ui probe_cw_batch_ui probe_cw_refusal_trace probe_cw_stage_persist probe_cw_state probe_cw_to_auto_compat probe_export probe_gate_flow probe_gate_ui probe_gen_config probe_import_ui probe_missing_chapter probe_needs_fix probe_outline_confirm probe_panel_fit probe_prompt_baseline probe_qml_compile probe_reader_close probe_settings_overlap probe_settings_tabs probe_shutdown probe_ui_gallery probe_update_ui probe_usage_dialog probe_wb_import probe_word_block probe_worldbook_activation probe_worldbook_format probe_worldbook_format_co
